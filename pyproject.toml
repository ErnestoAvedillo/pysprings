[project]
name = "muelles"
version = "0.1.0"
description = "Biblioteca de cálculo de muelles: compresión, tracción y torsión."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pint>=0.24",
    "pydantic>=2.13.4",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: the importable package lives at src/muelles.
# All package data (CSV material tables, .pkl regression models) under it is
# bundled automatically.
packages = ["src/muelles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
