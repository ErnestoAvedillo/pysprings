[project]
name = "springcalc"
version = "0.1.1"
description = "Spring calculation library: compression, extension, and torsion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ernesto Avedillo", email = "eavedillo@yahoo.es" },
]
keywords = ["muelles", "resortes", "springs", "shigley", "goodman", "fatiga", "ingeniería"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "build>=1.5.0",
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pint>=0.24",
    "pydantic>=2.13.4",
    "reportlab>=4.0",
    "scipy>=1.14",
    "twine>=6.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
publish = [
    "build>=1.5.0",
    "twine>=6.2.0",
]
# Only needed to run scripts/regresiones/*, which regenerate the plain-number
# JSON coefficients shipped in the package. Not required at runtime.
training = [
    "scikit-learn>=1.5",
]

[project.urls]
Homepage = "https://github.com/ErnestoAvedillo/pysprings"
Repository = "https://github.com/ErnestoAvedillo/pysprings"
Issues = "https://github.com/ErnestoAvedillo/pysprings/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: the importable package lives at src/springcalc.
# All package data (CSV material tables, JSON regression coefficients) under it
# is bundled automatically.
packages = ["src/springcalc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
